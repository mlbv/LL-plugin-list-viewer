name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-tags: true
        fetch-depth: 0
      
    - name: Get previous tag
      id: get_previous_tag
      run: |
        echo "PREV_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1))">>$GITHUB_ENV
        echo "CURR_TAG=$(git describe --abbrev=0 --tags)">>$GITHUB_ENV

    - name: Generate changelog
      id: generate_changelog
      run: |
        echo "Previous tag: $PREV_TAG"
        echo "Current tag: $CURR_TAG"
        FULL_CHANGELOG="**Full Changelog**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/$PREV_TAG...$CURR_TAG"
        COMMITS=$(git log $PREV_TAG..HEAD --pretty=format:"%h %s (%an, %ar)")
        {
          echo 'changelog<<EOF'
          echo -e "$COMMITS\n\n$FULL_CHANGELOG"
          echo EOF
        } >> $GITHUB_OUTPUT

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '22.23.4'

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Build project
      run: npm run build

    - name: Write archive checksum
      run: sha256sum list-viewer.zip > list-viewer.zip.sha256

    - name: publish release
      uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd
      with:
        artifacts: './list-viewer.zip,./list-viewer.zip.sha256'
        # bodyFile: "body.md"
        # generateReleaseNotes: true
        body: ${{ steps.generate_changelog.outputs.changelog }}
        makeLatest: 'true'
        artifactErrorsFailBuild: true
        immutableCreate: true
        token: ${{ secrets.GITHUB_TOKEN }}
